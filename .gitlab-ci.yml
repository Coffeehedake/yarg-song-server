# CI for yarg-song-server.
#
# Its first job is to EXIST. Without a .gitlab-ci.yml this project fell through
# to Auto DevOps, whose jobs assume a container executor: pipeline #2216 ran
# `/build/build.sh`, `/bin/herokuish` and `lsif-go` on a shell runner that has
# none of them and failed three jobs with exit 127. That is noise, not a signal,
# and a red pipeline nobody believes is worse than no pipeline at all.
#
# THE RUNNER IS A SHELL EXECUTOR on Vault2, so `image:` is ignored and nothing is
# guaranteed to be installed. Each pipeline therefore brings its own pinned Go
# toolchain, SHA-256 verified before use, cached between runs. Depending on
# whatever happens to be on the host is how a pipeline starts failing after an
# upgrade that had nothing to do with this project.
#
# ENG-1 is deliberately not a CI target. Runner 4 (eng-1-windows) is locked and
# does not run untagged jobs, and nothing here asks for it: it is Jay's
# workstation, not a build machine.

stages:
  - check
  - build
  - image

variables:
  # Keep this in step with the toolchain the workstations use. The SHA-256 is
  # the one published at go.dev/dl/?mode=json, verified 2026-09-05.
  GO_VERSION: "1.27.1"
  GO_SHA256: "63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445"

  # Never let the toolchain silently swap itself for another one: go.mod's
  # directive should be satisfied by what we installed, or the job should say so.
  GOTOOLCHAIN: "local"

  # Everything Go writes goes inside the project directory so it can be cached
  # and so nothing is left behind on the host.
  GOPATH: "$CI_PROJECT_DIR/.cache/gopath"
  GOCACHE: "$CI_PROJECT_DIR/.cache/build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/mod"

  GIT_DEPTH: "20"

cache:
  key: "go-$GO_VERSION"
  paths:
    - .toolchain/
    - .cache/

default:
  before_script:
    - ./ci/bootstrap-go.sh .toolchain
    - export PATH="$CI_PROJECT_DIR/.toolchain/go/bin:$PATH"
    - go version
    - go env CGO_ENABLED

# The one check that needs no toolchain, so it answers fastest.
dockerfile-go-version:
  stage: check
  before_script: []
  script:
    - ./ci/check-dockerfile-go-version.sh

lint:
  stage: check
  script:
    - ./ci/check-gofmt.sh
    - go vet ./...

test:
  stage: check
  script:
    - go test ./... -count=1

# Kept separate from `test` so a race failure is legible as a race failure.
#
# If this job dies with "-race requires cgo" then the Vault2 runner has no C
# toolchain. That is a host change and belongs to whoever owns that box - do NOT
# quietly drop -race to make the pipeline green. A green produced by removing the
# instrument is the failure mode this project audits other repos for.
test:race:
  stage: check
  script:
    - go test ./... -count=1 -race

# Every platform the project promises. The Pi target is a promise, not a bonus,
# and CGO_ENABLED=0 is what keeps all six a single `go build`.
release:
  stage: build
  variables:
    CGO_ENABLED: "0"
  script:
    - mkdir -p dist
    - VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo "$CI_COMMIT_SHORT_SHA")"
    - echo "building $VERSION"
    - |
      set -e
      build() {
        goos="$1"; goarch="$2"; goarm="$3"; out="$4"
        echo "  $goos/$goarch${goarm:+v$goarm}"
        GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" \
          go build -ldflags "-s -w -X main.version=$VERSION" -o "dist/$out" ./cmd/yarg-song-server
      }
      build linux   amd64 "" yarg-song-server-linux-amd64
      build linux   arm64 "" yarg-song-server-linux-arm64
      build linux   arm   7  yarg-song-server-linux-armv7
      build darwin  amd64 "" yarg-song-server-darwin-amd64
      build darwin  arm64 "" yarg-song-server-darwin-arm64
      build windows amd64 "" yarg-song-server-windows-amd64.exe
    - ls -l dist
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# The container image: one manifest covering linux/amd64 and linux/arm64.
#
# IT NEEDS NO EMULATION, AND NOTHING ON THE RUNNER HOST SHOULD BE CHANGED TO
# MAKE IT WORK. Go cross-compiles natively, and the Dockerfile pins its build
# stage with `FROM --platform=$BUILDPLATFORM`, so the toolchain runs at the
# host's own architecture and Go emits the arm64 binary itself. Emulation would
# only enter if the build stage were pulled FOR the target platform, which that
# directive is there to prevent. If anyone finds themselves installing qemu or
# registering binfmt_misc for this project, they have gone wrong.
#
# The runner is a shell executor with the host Docker socket mounted, which is
# how fatalexception/fallout-research already builds and pushes to this
# registry. Nothing new is needed on the host.
container-image:
  stage: image
  variables:
    BUILDX_BUILDER: yarg-song-server-multiarch
  # No Go here, so the default toolchain bootstrap is not wanted - and neither
  # are the Go caches, which would otherwise be restored into the build context.
  cache: []
  before_script:
    - ./ci/ensure-buildx.sh
  script:
    # The DEFAULT buildx builder uses the `docker` driver, which cannot build
    # more than one platform and cannot produce a manifest list at all. A
    # docker-container builder is required. This is the step that is easy to
    # miss, because buildx then fails with a message about the docker driver
    # rather than anything that mentions multi-arch.
    - docker buildx inspect "$BUILDX_BUILDER" >/dev/null 2>&1 || docker buildx create --name "$BUILDX_BUILDER" --driver docker-container --bootstrap
    - docker buildx use "$BUILDX_BUILDER"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo "$CI_COMMIT_SHORT_SHA")"
      set -- --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        set -- "$@" --tag "$CI_REGISTRY_IMAGE:latest"
      fi
      echo "building $VERSION for linux/amd64,linux/arm64"
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --build-arg VERSION="$VERSION" \
        "$@" \
        --push \
        .
    # Exit 0 from buildx is NOT evidence the image is really multi-arch, and an
    # amd64 binary under an arm64 manifest entry would pass every check that
    # only reads exit codes - and then fail to start on the Pi.
    - ./ci/verify-multiarch.sh "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  after_script:
    - docker logout "$CI_REGISTRY" 2>/dev/null || true
    # Remove the builder rather than leaving it behind. buildx's own state lives
    # in $HOME/.docker INSIDE the GitLab-CE container, which Unraid recreates
    # nightly, while the buildkit container it spawns lives on the HOST daemon
    # and survives. That asymmetry would orphan one buildkit container per
    # recreate into a docker.img that has 99 GB free.
    - docker buildx rm "$BUILDX_BUILDER" 2>/dev/null || true
  rules:
    # Default branch, plus ci/* so the job can be proved on a branch before it
    # is trusted on main. Deliberately not every branch: each run pushes an
    # image, and the disk it lands on is not large.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH =~ /^ci\//'
